name: Build ARM32 for Mi TV Box S

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-arm32:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_HOME=$(pwd)/android-ndk-r27c" >> $GITHUB_ENV

      - name: Build CPython for ARM32
        run: |
          python scripts/build.py
          echo "=== Build complete ==="
          ls -la dist/

      - name: Upload artifact (downloadable from Actions)
        uses: actions/upload-artifact@v4
        with:
          name: py2droid-arm32-module
          path: dist/*.zip
          retention-days: 30

      - name: Create GitHub Release (only on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            ## Py2Droid ARM32 for Mi TV Box S
            
            This build includes **32-bit ARM** support only.
            
            ### Installation
            1. Download the zip file
            2. Open Magisk → Modules → Install from storage
            3. Select the zip and install
            4. Reboot
            5. Run `python3 --version` to verify
